'use strict';const KEY='kodkhem_cute_live_v1',INITIAL=[10,60,20,10],PRIZES=['แก้วเก็บความเย็น','ส่วนลด 5 บาทในบิลถัดไป','ส่วนลด 10 บาทในบิลถัดไป','โอ๊ย..ตกใจหมด! รับน้ำฟรี 1 แก้ว'];const $=id=>document.getElementById(id);let state,spinning=false,rotation=0;function fresh(){return {v:1,stock:[...INITIAL],history:[],locked:false,pin:''}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===1&&Array.isArray(x.stock)&&x.stock.length===4&&x.stock.every((n,i)=>Number.isInteger(n)&&n>=0&&n<=INITIAL[i])&&Array.isArray(x.history)&&typeof x.locked==='boolean'&&typeof x.pin==='string')return x}catch(e){}return fresh()}state=load();function total(){return state.stock.reduce((a,b)=>a+b,0)}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function render(){state.stock.forEach((n,i)=>$('c'+i).textContent=n+'/'+INITIAL[i]);$('spin').disabled=spinning||state.locked||total()===0;if(total()===0)$('notice').textContent='🎉 แจกรางวัลครบ 100 สิทธิ์แล้ว!';else if(state.locked)$('notice').textContent='🔒 สุ่มแล้ว • รอพนักงานยืนยัน';else $('notice').textContent='ทุกยอดซื้อครบ 100 บาท รับ 1 สิทธิ์'}function randint(max){let a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}function choose(){let n=randint(total());for(let i=0;i<4;i++){if(n<state.stock[i])return i;n-=state.stock[i]}}function show(html){$('panel').innerHTML=html;$('modal').classList.add('show')}function hide(){$('modal').classList.remove('show')}function closeBtn(){return '<button class="secondary" onclick="hide()">ปิด</button>'}function confetti(){let c=$('confetti');c.innerHTML='';for(let i=0;i<32;i++){let e=document.createElement('span');e.textContent=['🎃','✨','👻','🎉'][i%4];e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*.7+'s';c.appendChild(e)}setTimeout(()=>c.innerHTML='',3300)}
$('spin').onclick=()=>{if(spinning||state.locked||!total())return;spinning=true;render();$('notice').textContent='👻 กำลังหมุน... ลุ้นกันเลย!';let winner=choose();const angle=[0,270,180,90][winner];const current=((rotation%360)+360)%360;rotation+=1800+((360-angle-current+360)%360);$('wheel').style.transform='rotate('+rotation+'deg)';setTimeout(()=>{state.stock[winner]--;state.locked=true;state.history.unshift({prize:winner,at:new Date().toLocaleString('th-TH')});spinning=false;save();confetti();show('<h2>🎉 ยินดีด้วย! 🎉</h2><p class="winner">'+PRIZES[winner]+'</p><p>กรุณาแสดงผลให้พนักงาน</p>'+closeBtn())},3500)};
$('history').onclick=()=>{show('<h2>📜 ประวัติการสุ่ม</h2><p>แจกไปแล้ว '+(100-total())+' / 100 รางวัล</p><div style="max-height:50vh;overflow:auto">'+(state.history.length?state.history.map((h,i)=>'<div class="entry">'+(state.history.length-i)+'. '+PRIZES[h.prize]+'<br>'+h.at+'</div>').join(''):'ยังไม่มีประวัติ')+'</div>'+closeBtn())};
$('staff').onclick=()=>{show('<h2>🔒 '+(state.pin?'สำหรับพนักงาน':'ตั้ง PIN พนักงานครั้งแรก')+'</h2><p class="sub">'+(state.pin?'ใส่ PIN เพื่อจัดการเกม':'ตั้ง PIN ตัวเลข 4–8 หลัก')+'</p><input id="pinInput" type="password" inputmode="numeric" placeholder="PIN"><p id="error" style="color:#ffc4ba"></p><button id="authGo">ยืนยัน</button>'+closeBtn());$('authGo').onclick=()=>{let p=$('pinInput').value;if(!state.pin){if(!/^\d{4,8}$/.test(p)){$('error').textContent='PIN ต้องเป็นตัวเลข 4–8 หลัก';return}state.pin=p;save()}else if(p!==state.pin){$('error').textContent='PIN ไม่ถูกต้อง';return}admin()}};
function admin(){show('<h2>⚙️ จัดการเกม</h2><p>เหลือ '+total()+' / 100 รางวัล</p><button id="next" '+(!state.locked||!total()?'disabled':'')+'>✅ อนุญาตลูกค้าคนถัดไป</button><button class="secondary" id="pinChange">เปลี่ยน PIN</button><button class="secondary" id="reset">รีเซ็ตกิจกรรม</button>'+closeBtn());$('next').onclick=()=>{state.locked=false;save();hide()};$('pinChange').onclick=()=>{let p=prompt('PIN ใหม่ 4–8 หลัก');if(p===null)return;if(!/^\d{4,8}$/.test(p)){alert('PIN ต้องเป็นตัวเลข 4–8 หลัก');return}state.pin=p;save();alert('เปลี่ยน PIN แล้ว')};$('reset').onclick=()=>{if(!confirm('ลบประวัติและคืนรางวัลทั้งหมดเป็น 100 รางวัล?'))return;if(prompt('พิมพ์ RESET เพื่อยืนยัน')!=='RESET')return;let pin=state.pin;state=fresh();state.pin=pin;save();hide()}};
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
