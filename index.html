<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#291039"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>โคตรเข้ม Halloween Lucky Draw</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#180d28;color:white;font-family:system-ui,'Noto Sans Thai',sans-serif}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}.screen{position:relative;max-width:620px;margin:auto;aspect-ratio:1024/1536;background:url('design.webp') center top/100% 100% no-repeat;overflow:hidden}.hot{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer}.spinBtn{left:27%;top:65.1%;width:46%;height:8.2%;border-radius:40px}.historyBtn{left:20%;top:92.2%;width:28%;height:6%}.staffBtn{left:52%;top:92.2%;width:28%;height:6%}.wheel{position:absolute;left:19.5%;top:23.7%;width:61%;aspect-ratio:1;border:1.15vw solid #ffc66e;border-radius:50%;background:conic-gradient(from -45deg,#b67ee1 0 25%,#ffac75 25% 50%,#ffe1aa 50% 75%,#ffb35e 75% 100%);box-shadow:0 0 0 5px #47233c,0 0 0 10px #efb05d,0 0 26px #f7bd7d;transition:transform 3.5s cubic-bezier(.12,.75,.16,1);display:grid;place-items:center}.wheel:before{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,transparent 49.5%,#562f4e 49.5% 50.5%,transparent 50.5%),linear-gradient(0deg,transparent 49.5%,#562f4e 49.5% 50.5%,transparent 50.5%);opacity:.6}.sector{position:absolute;display:flex;align-items:center;flex-direction:column;font-weight:900;text-align:center;font-size:clamp(13px,3vw,19px);line-height:1.2;text-shadow:0 1px #fff8;color:#45263a}.sector em{font-style:normal;font-size:clamp(27px,7vw,43px)}.s0{top:9%;left:50%;transform:translateX(-50%)}.s1{top:47%;right:5%;transform:translateY(-50%)}.s2{bottom:9%;left:50%;transform:translateX(-50%)}.s3{top:47%;left:5%;transform:translateY(-50%)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;width:19%;aspect-ratio:1;background:#e6b87a;border:5px solid #623c3c;display:grid;place-items:center;font-size:clamp(19px,5vw,34px);box-shadow:0 2px 6px #0008}.pointer{position:absolute;left:50%;top:22.5%;transform:translateX(-50%);font-size:clamp(32px,8vw,54px);color:#fff4ce;text-shadow:0 3px #8c4d35;z-index:2}.count{position:absolute;top:85.6%;width:20%;height:3.3%;text-align:center;font-weight:1000;font-size:clamp(14px,3.6vw,23px);text-shadow:0 2px 4px #000;color:#ffe1a0;background:#2b1521dd;border-radius:12px;padding-top:2px}.c0{left:5%}.c1{left:29%}.c2{left:53%}.c3{left:77%}.notice{position:absolute;left:10%;right:10%;top:71.5%;padding:5px;border-radius:15px;background:#291537ef;text-align:center;font-weight:900;font-size:clamp(12px,3.3vw,20px);color:#fff0b7;min-height:28px}.overlay{position:fixed;inset:0;background:#0b0412e8;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.panel{width:min(420px,100%);max-height:90vh;overflow:auto;background:linear-gradient(#64346f,#2c193b);border:3px solid #e9b67b;border-radius:24px;padding:22px;text-align:center;box-shadow:0 10px 40px #0009}.panel h2{color:#ffe4a3}.panel input{width:100%;padding:12px;border-radius:12px;font-size:22px;border:2px solid #d4a0b7;margin:10px 0}.panel button{display:block;width:100%;border-radius:15px;background:#ffbd6a;color:#321b35;border:0;padding:13px;font-weight:900;margin:9px 0}.panel button.secondary{background:#755586;color:white}.panel button:disabled{opacity:.45}.entry{padding:8px;border-bottom:1px solid #987a9e;text-align:left;font-size:13px}.sub{font-size:13px;color:#f6d8e5}.winner{font-size:26px;color:#ffda8e}.confetti{pointer-events:none;position:absolute;inset:0;overflow:hidden}.confetti span{position:absolute;top:-15%;animation:fall 2.5s linear forwards;font-size:25px}@keyframes fall{to{top:115%;transform:rotate(540deg)}}@media(min-width:620px){.wheel{border-width:8px}}@media(max-width:370px){.sector{font-size:12px}.sector em{font-size:26px}}
</style></head><body><div class="screen"><div class="pointer">▼</div><div class="wheel" id="wheel"><div class="sector s0"><em>🥤</em>แก้วเย็น</div><div class="sector s1"><em>🎟️</em>ลด 5 บาท</div><div class="sector s2"><em>🎁</em>ลด 10 บาท</div><div class="sector s3"><em>🧋</em>น้ำฟรี</div><div class="hub">☕</div></div><div class="confetti" id="confetti"></div><div class="notice" id="notice">ทุกยอดซื้อครบ 100 บาท รับ 1 สิทธิ์</div><div class="count c0" id="c0"></div><div class="count c1" id="c1"></div><div class="count c2" id="c2"></div><div class="count c3" id="c3"></div><button class="hot spinBtn" id="spin" aria-label="เริ่มหมุนวงล้อ"></button><button class="hot historyBtn" id="history" aria-label="ประวัติการสุ่ม"></button><button class="hot staffBtn" id="staff" aria-label="สำหรับพนักงาน"></button></div>
<div class="overlay" id="modal"><div class="panel" id="panel"></div></div><script>
'use strict';const KEY='kodkhem_cute_live_v1',INITIAL=[10,60,20,10],PRIZES=['แก้วเก็บความเย็น','ส่วนลด 5 บาทในบิลถัดไป','ส่วนลด 10 บาทในบิลถัดไป','โอ๊ย..ตกใจหมด! รับน้ำฟรี 1 แก้ว'];const $=id=>document.getElementById(id);let state,spinning=false,rotation=0;function fresh(){return {v:1,stock:[...INITIAL],history:[],locked:false,pin:''}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===1&&Array.isArray(x.stock)&&x.stock.length===4&&x.stock.every((n,i)=>Number.isInteger(n)&&n>=0&&n<=INITIAL[i])&&Array.isArray(x.history)&&typeof x.locked==='boolean'&&typeof x.pin==='string')return x}catch(e){}return fresh()}state=load();function total(){return state.stock.reduce((a,b)=>a+b,0)}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function render(){state.stock.forEach((n,i)=>$('c'+i).textContent=n+'/'+INITIAL[i]);$('spin').disabled=spinning||state.locked||total()===0;if(total()===0)$('notice').textContent='🎉 แจกรางวัลครบ 100 สิทธิ์แล้ว!';else if(state.locked)$('notice').textContent='🔒 สุ่มแล้ว • รอพนักงานยืนยัน';else $('notice').textContent='ทุกยอดซื้อครบ 100 บาท รับ 1 สิทธิ์'}function randint(max){let a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}function choose(){let n=randint(total());for(let i=0;i<4;i++){if(n<state.stock[i])return i;n-=state.stock[i]}}function show(html){$('panel').innerHTML=html;$('modal').classList.add('show')}function hide(){$('modal').classList.remove('show')}function closeBtn(){return '<button class="secondary" onclick="hide()">ปิด</button>'}function confetti(){let c=$('confetti');c.innerHTML='';for(let i=0;i<32;i++){let e=document.createElement('span');e.textContent=['🎃','✨','👻','🎉'][i%4];e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*.7+'s';c.appendChild(e)}setTimeout(()=>c.innerHTML='',3300)}
$('spin').onclick=()=>{if(spinning||state.locked||!total())return;spinning=true;render();$('notice').textContent='👻 กำลังหมุน... ลุ้นกันเลย!';let winner=choose();const angle=[0,270,180,90][winner];const current=((rotation%360)+360)%360;rotation+=1800+((360-angle-current+360)%360);$('wheel').style.transform='rotate('+rotation+'deg)';setTimeout(()=>{state.stock[winner]--;state.locked=true;state.history.unshift({prize:winner,at:new Date().toLocaleString('th-TH')});spinning=false;save();confetti();show('<h2>🎉 ยินดีด้วย! 🎉</h2><p class="winner">'+PRIZES[winner]+'</p><p>กรุณาแสดงผลให้พนักงาน</p>'+closeBtn())},3500)};
$('history').onclick=()=>{show('<h2>📜 ประวัติการสุ่ม</h2><p>แจกไปแล้ว '+(100-total())+' / 100 รางวัล</p><div style="max-height:50vh;overflow:auto">'+(state.history.length?state.history.map((h,i)=>'<div class="entry">'+(state.history.length-i)+'. '+PRIZES[h.prize]+'<br>'+h.at+'</div>').join(''):'ยังไม่มีประวัติ')+'</div>'+closeBtn())};
$('staff').onclick=()=>{show('<h2>🔒 '+(state.pin?'สำหรับพนักงาน':'ตั้ง PIN พนักงานครั้งแรก')+'</h2><p class="sub">'+(state.pin?'ใส่ PIN เพื่อจัดการเกม':'ตั้ง PIN ตัวเลข 4–8 หลัก')+'</p><input id="pinInput" type="password" inputmode="numeric" placeholder="PIN"><p id="error" style="color:#ffc4ba"></p><button id="authGo">ยืนยัน</button>'+closeBtn());$('authGo').onclick=()=>{let p=$('pinInput').value;if(!state.pin){if(!/^\d{4,8}$/.test(p)){$('error').textContent='PIN ต้องเป็นตัวเลข 4–8 หลัก';return}state.pin=p;save()}else if(p!==state.pin){$('error').textContent='PIN ไม่ถูกต้อง';return}admin()}};
function admin(){show('<h2>⚙️ จัดการเกม</h2><p>เหลือ '+total()+' / 100 รางวัล</p><button id="next" '+(!state.locked||!total()?'disabled':'')+'>✅ อนุญาตลูกค้าคนถัดไป</button><button class="secondary" id="pinChange">เปลี่ยน PIN</button><button class="secondary" id="reset">รีเซ็ตกิจกรรม</button>'+closeBtn());$('next').onclick=()=>{state.locked=false;save();hide()};$('pinChange').onclick=()=>{let p=prompt('PIN ใหม่ 4–8 หลัก');if(p===null)return;if(!/^\d{4,8}$/.test(p)){alert('PIN ต้องเป็นตัวเลข 4–8 หลัก');return}state.pin=p;save();alert('เปลี่ยน PIN แล้ว')};$('reset').onclick=()=>{if(!confirm('ลบประวัติและคืนรางวัลทั้งหมดเป็น 100 รางวัล?'))return;if(prompt('พิมพ์ RESET เพื่อยืนยัน')!=='RESET')return;let pin=state.pin;state=fresh();state.pin=pin;save();hide()}};
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
